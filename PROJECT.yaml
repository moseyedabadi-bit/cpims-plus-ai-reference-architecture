project:
  name: CPIMS+ AI
  status: research-runnable-synthetic-lab-with-persian-primero-overlay
  owner_model: individual-public-interest
  deployment_with_real_data: prohibited-until-gates-pass
  machine_readable: true
  human_readable: true

upstream_software:
  platform: Primero
  repository: primeroIMS/primero
  pinned_version: v2.14.5
  upstream_license: AGPL-3.0-or-later
  official_cpims_configuration_included: false
  note: >-
    Official CPIMS+ configuration bundles are distributed separately by upstream maintainers.
    This repository provides an independent localization/security overlay and a synthetic
    workflow laboratory; it does not claim to reproduce the official CPIMS+ configuration.

localization:
  target_locale: fa-IR
  direction: rtl
  source_structure_locale: fa-AF
  coverage_model: clone-all-upstream-translation-keys-then-normalize-values
  reproducible_generator: implementation/localization/build_fa_ir.rb
  primero_patcher: implementation/localization/apply_to_primero.rb
  qa: implementation/localization/qa_locale.rb
  upstream_blob_pinning: true
  calendar_storage_semantics_changed: false
  professional_language_review_required: true
  review_domains: [child_protection, legal, medical, safeguarding]

synthetic_lab:
  runnable: true
  location: lab/
  runtime: docker-compose
  public_entrypoint: http://localhost:8080
  exposed_services: [portal]
  synthetic_data_only: true
  official_cpims_runtime: false
  logical_idp_simulation_only: true
  production_crypto: false
  components:
    - portal
    - trust_gateway
    - idp_a
    - idp_b
    - idp_c
    - policy_pdp
    - data_gateway_pep
    - synthetic_case_domain
    - synthetic_oversight_authority
    - ai_context_service
    - tamper_evident_audit
  isolated_networks:
    - identity
    - policy
    - policy_enforcement
    - data
    - ai
    - audit
  enforced_properties:
    - two_of_three_identity_threshold
    - issuer_audience_nonce_freshness_expiry_replay_checks
    - same_subject_binding
    - opaque_browser_session
    - authentication_separate_from_consent
    - l2_consent_required
    - l3_step_up_consent_required
    - l4_independent_legal_authorization_required
    - l4_bulk_export_denied
    - oversight_has_no_case_database_route
    - gateway_has_no_direct_case_database_route
    - ai_has_no_direct_case_database_route
    - ai_l4_denied
    - ai_identity_fields_rejected
    - human_decision_recorded_separately
    - pseudonymous_tamper_evident_audit
    - consent_revocation_enforced
  validation:
    unit_tests: lab/tests/test_lab.py
    e2e_test: lab/tests/e2e_lab.py
    ci_workflow: .github/workflows/synthetic-lab-validation.yml

implementation:
  synthetic_only: true
  ci_workflow: .github/workflows/implementation-validation.yml
  security_reference: implementation/security/reference.py
  security_tests: implementation/security/test_reference.py
  production_authentication_claim: false

mission:
  statement: >-
    Explore a human-centered, privacy-preserving AI architecture for child-protection
    and humanitarian decision support in high-risk institutional environments.
  ai_role: assist-only
  human_role: accountable-decision-maker

invariants:
  - no_single_point_of_complete_knowledge
  - identifier_is_not_authority
  - purpose_bound_disclosure
  - human_in_command
  - distributed_trust
  - local_biometric_activation_only
  - pairwise_pseudonymous_identifiers
  - minimum_necessary_context
  - independent_auditability
  - consent_distinct_from_legal_authority
  - infrastructure_privilege_not_case_authority
  - synthetic_first

identity:
  intended_production_model:
    local_biometric_verification: true
    biometric_storage_in_cpims: false
    external_idp_count: 3
    trust_policy: 2-of-3-valid-independent-assertions
    providers_issue: signed_assertions
    gateway_issues: scoped-session-credential
    global_child_identifier: forbidden
    pairwise_pseudonymous_identifiers: required
  assertion_checks:
    - issuer
    - audience
    - nonce
    - freshness
    - expiration
    - replay
    - subject_binding

consent:
  authentication_separate_from_consent: true
  consent_separate_from_legal_authority: true
  step_up_for_sensitive_layers: true
  revocable: true
  time_bound: true
  purpose_bound: true
  requester_bound: true

data_classification:
  L1: operational
  L2: sensitive-social-family
  L3: highly-sensitive-health-violence-psychological
  L4: exceptional-restricted

L4_access:
  superuser_model: forbidden
  standing_judicial_database_access: forbidden
  authorization_authority: legally-defined-judicial-statutory-or-emergency-grant
  requirements:
    - scoped_case_reference
    - explicit_purpose
    - requester_identity
    - permitted_operation
    - no_bulk_export
    - short_ttl
    - immutable_audit

ai:
  direct_database_access: forbidden
  persistent_identity: forbidden
  case_anchor_visibility: forbidden
  raw_identity_fields: forbidden
  allowed_capabilities: [summarize, retrieve_evidence, compare, suggest, explain, identify_uncertainty]
  forbidden_capabilities:
    - approve_reunification
    - reject_family
    - remove_child
    - deny_service
    - authorize_disclosure
    - issue_judicial_action
  required_output_fields:
    - evidence
    - recommendation
    - confidence
    - uncertainty
    - missing_evidence
    - alternative_explanations
    - model_version
    - decision_authority
  valid_abstention_outputs: [insufficient_evidence, human_investigation_required]

data:
  production_training_default: forbidden
  derived_attributes_preferred: true
  embeddings_are_data: true
  backup_is_data: true
  bulk_export_default: forbidden
  domain_key_separation: required

audit:
  independent_append_only_target: true
  admin_deletion_target: forbidden
  direct_identity_fields: forbidden
  tamper_evidence_required: true

standards_alignment:
  claim: nist-aligned-not-certified
  references:
    - NIST-SP-800-63-4
    - NIST-SP-800-63A-4
    - NIST-SP-800-63B-4
    - NIST-SP-800-63C-4
    - NIST-SP-800-207
    - NIST-SP-800-207A
    - NIST-SP-800-53-Rev5
    - NIST-CSF-2.0
    - NIST-Privacy-Framework
    - NIST-AI-RMF

release_gates:
  - architecture_review
  - professional_fa_ir_language_review
  - authorized_cpims_configuration_review
  - privacy_and_threat_model_review
  - synthetic_red_team_poc
  - independent_security_and_ethics_review
  - jurisdiction_specific_legal_and_child_protection_review

repository_safety:
  real_child_data: forbidden
  real_family_data: forbidden
  biometric_samples: forbidden
  real_tokens: forbidden
  organization_secrets: forbidden
  real_ip_hostname_credentials: forbidden
