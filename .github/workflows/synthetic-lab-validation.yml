name: synthetic-lab-validation

on:
  push:
    paths:
      - 'lab/**'
      - '.github/workflows/synthetic-lab-validation.yml'
  pull_request:
    paths:
      - 'lab/**'
      - '.github/workflows/synthetic-lab-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-reference-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile lab sources
        working-directory: lab
        run: python -m compileall -q services tests
      - name: Run unit tests
        working-directory: lab
        run: python -m unittest -v tests.test_lab
      - name: Run multi-process end-to-end workflow
        working-directory: lab
        run: python tests/e2e_lab.py

  docker-compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Compose model
        working-directory: lab
        run: docker compose config --quiet
      - name: Build and start synthetic lab
        working-directory: lab
        run: docker compose up -d --build
      - name: Wait for public health endpoint
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f lab/docker-compose.yml ps
          docker compose -f lab/docker-compose.yml logs --no-color
          exit 1
      - name: Verify Persian portal is served
        run: |
          curl --fail --silent http://127.0.0.1:8080/ | grep -q 'CPIMS+ AI'
      - name: Show container state
        if: always()
        working-directory: lab
        run: docker compose ps
      - name: Stop and remove synthetic data volume
        if: always()
        working-directory: lab
        run: docker compose down -v --remove-orphans
